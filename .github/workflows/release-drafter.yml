name: Release Drafter

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Pin to specific commit SHA for security (v6.1.0)
      # See: https://github.com/release-drafter/release-drafter/releases/tag/v6.1.0
      - uses: release-drafter/release-drafter@6db134d15f3909ccc9eefd369f02bd1e9cffdf97
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
